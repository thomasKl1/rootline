# Copie ce fichier en secrets.yaml (ignoré par git) et remplis-le.

# Réseau WiFi 2,4 GHz (l'ESP32 ne se connecte pas au 5 GHz)
wifi_ssid: "NOM_DU_WIFI"
wifi_password: "MOT_DE_PASSE"

# Fonction Supabase qui reçoit les mesures
ingest_url: "https://<ton-projet>.supabase.co/functions/v1/ingest-readings"
# Même valeur que le secret INGEST_TOKEN des fonctions Supabase (openssl rand -hex 32)
ingest_token: "COLLE_ICI_LE_JETON"
